name: Update squeeze data

on:
  schedule:
    - cron: "30 23 * * 1-5"   # 08:30 KST Tue-Sat (after FINRA daily file)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update.yml"
      - "scripts/build_data.py"

permissions:
  contents: write

concurrency:
  group: update-squeeze
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Build data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/build_data.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update squeeze data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
